<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background: linear-gradient(
                135deg,
                #ff4d8d,
                #ff85a2
            );

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial;

        }

        .login-box{

            background: white;

            padding: 30px;

            border-radius: 20px;

            width: 100%;

            max-width: 400px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.2);

        }

        h2{

            text-align: center;

            margin-bottom: 25px;

            color: #ff4d8d;

            font-weight: bold;

        }

        .btn-login{

            background: #ff4d8d;

            border: none;

        }

        .btn-login:hover{

            background: #ff3377;

        }

        .cadastro{

            text-align: center;

            margin-top: 20px;

        }

        .cadastro a{

            text-decoration: none;

            color: #ff4d8d;

            font-weight: bold;

        }

    </style>

</head>
<body>

    <div class="login-box">

        <h2>
     🌸 ElaViva 
        </h2>

        <form action="/login" method="POST">

            <div class="mb-3">

                <label>Email</label>

                <input type="email"
                name="email"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

                <label>Senha</label>

                <input type="password"
                name="senha"
                class="form-control"
                required>

            </div>

            <button type="submit"
            class="btn btn-login btn-primary w-100">

                Entrar

            </button>

        </form>

        <div class="cadastro">

            Não possui conta?

            <br><br>

            <a href="/cadastro"
               class="btn btn-outline-danger">

                Criar conta

            </a>

        </div>

    </div>

</body>
</html>
