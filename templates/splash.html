<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>App Mulheres</title>

    <style>

        *{

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body{

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            background: linear-gradient(
                135deg,
                #ff4d8d,
                #ff85a2
            );

            font-family: Arial;

            overflow: hidden;

        }

        .logo{

            font-size: 70px;

            animation: pulse 1.5s infinite;

        }

        h1{

            color: white;

            margin-top: 20px;

            font-size: 35px;

        }

        p{

            color: white;

            margin-top: 10px;

            opacity: 0.9;

        }

        .loader{

            width: 120px;
            height: 6px;

            background: rgba(255,255,255,0.3);

            border-radius: 10px;

            margin-top: 40px;

            overflow: hidden;

        }

        .loader span{

            display: block;

            width: 0%;

            height: 100%;

            background: white;

            animation: load 3s linear forwards;

        }

        @keyframes load{

            100%{

                width: 100%;

            }

        }

        @keyframes pulse{

            0%{

                transform: scale(1);

            }

            50%{

                transform: scale(1.1);

            }

            100%{

                transform: scale(1);

            }

        }

    </style>

    <script>

        setTimeout(function(){

            window.location.href = "/login_page";

        }, 3000);

    </script>

</head>
<body>

    <div class="logo">

        💖

    </div>

    <h1>

        App Mulheres

    </h1>

    <p>

        Seu app inteligente feminino

    </p>

    <div class="loader">

        <span></span>

    </div>

</body>
</html>
